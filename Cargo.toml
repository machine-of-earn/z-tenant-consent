[package]
name = "z-tenant-consent"
version = "0.1.0"
edition = "2021"
description = "Consent-gated notice dispatch as a T3N TEE contract"
license = "MIT"

# cdylib is what makes the wasm32-wasip2 target emit a WASM *component*.
# "lib" is kept so the decision logic stays unit-testable on the native target.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
